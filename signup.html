<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Create RankHub Account | Exam Preparation Platform</title>

  <link rel="stylesheet" href="/style.css">

  <style>
    :root {
      --primary: #DC2626;
      --primary-hover: #B91C1C;
      --bg-page: #F9FAFB;
      --card-bg: #FFFFFF;
      --text-main: #111827;
      --text-secondary: #6B7280;
      --border-color: #E5E7EB;
      --error-color: #EF4444;
      --success-color: #10B981;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      margin: 32px auto;
      padding: 24px;
    }

    .auth-header-brand {
      display: flex;
      justify-content: center;
      margin-bottom: 24px;
    }

    .auth-logo-link {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    .auth-logo-icon {
      color: var(--primary);
      width: 28px;
      height: 28px;
    }

    .auth-logo-text {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.03em;
    }

    .auth-logo-text .logo-accent {
      color: var(--primary);
    }

    .auth-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 8px;
      text-align: center;
    }

    .auth-subtitle {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      margin: 0 0 28px;
      text-align: center;
      line-height: 1.4;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
    }

    .form-label {
      font-size: 0.875rem;
      font-weight: 600;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      height: 48px;
      padding: 0 16px;
      font-size: 0.9375rem;
      color: var(--text-main);
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.12);
    }

    .form-input.error {
      border-color: var(--error-color);
    }

    .password-toggle-btn {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .inline-error {
      font-size: 0.775rem;
      color: var(--error-color);
      display: none;
      font-weight: 500;
    }

    .auth-submit-btn {
      width: 100%;
      height: 48px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
      margin-top: 8px;
    }

    .auth-submit-btn:hover {
      background-color: var(--primary-hover);
    }

    .auth-submit-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      margin: 20px 0;
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 600;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid var(--border-color);
    }

    .auth-divider::before {
      margin-right: 12px;
    }

    .auth-divider::after {
      margin-left: 12px;
    }

    .google-signin-btn {
      width: 100%;
      height: 48px;
      background: #FFFFFF;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .google-signin-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .auth-footer-prompt {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-secondary);
    }

    .auth-footer-prompt a {
      color: var(--primary);
      font-weight: 700;
      text-decoration: none;
    }

    .auth-global-error,
    .auth-global-success {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.875rem;
      margin-bottom: 20px;
      display: none;
      font-weight: 500;
      line-height: 1.45;
    }

    .auth-global-error {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: #991B1B;
    }

    .auth-global-success {
      background: #ECFDF5;
      border: 1px solid #A7F3D0;
      color: #065F46;
    }

    @media (max-width: 480px) {
      .auth-container {
        margin: 16px auto;
        padding: 16px;
      }

      .auth-card {
        padding: 24px 20px;
      }
    }
  </style>

  <style id="auth-guard-style">
    body {
      display: none !important;
    }
  </style>

 <script type="module">

import {
  auth,
  db,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  updateProfile,
  doc,
  setDoc,
  checkPhoneExists
} from "./firebase.js";


document.addEventListener("DOMContentLoaded", () => {

  /* ==========================================================
     ELEMENTS
  ========================================================== */

  const signupForm =
    document.getElementById("signupForm");

  const fullNameInput =
    document.getElementById("fullNameInput");

  const mobileInput =
    document.getElementById("mobileInput");

  const emailInput =
    document.getElementById("emailInput");

  const passwordInput =
    document.getElementById("passwordInput");

  const confirmPasswordInput =
    document.getElementById("confirmPasswordInput");

  const fullNameError =
    document.getElementById("fullNameError");

  const mobileError =
    document.getElementById("mobileError");

  const emailError =
    document.getElementById("emailError");

  const passwordError =
    document.getElementById("passwordError");

  const confirmPasswordError =
    document.getElementById("confirmPasswordError");

  const submitBtn =
    document.getElementById("submitBtn");

  const googleSignInBtn =
    document.getElementById("googleSignInBtn");

  const globalError =
    document.getElementById("globalError");

  const globalSuccess =
    document.getElementById("globalSuccess");


  /* ==========================================================
     PASSWORD TOGGLE
  ========================================================== */

  function setupPasswordToggle(inputId, buttonId) {

    const input =
      document.getElementById(inputId);

    const button =
      document.getElementById(buttonId);

    if (!input || !button) {
      return;
    }

    button.addEventListener("click", () => {

      const show =
        input.type === "password";

      input.type =
        show ? "text" : "password";

      button.setAttribute(
        "aria-label",
        show
          ? "Hide Password"
          : "Show Password"
      );
    });
  }


  setupPasswordToggle(
    "passwordInput",
    "passwordToggle"
  );

  setupPasswordToggle(
    "confirmPasswordInput",
    "confirmPasswordToggle"
  );


  /* ==========================================================
     MOBILE INPUT
  ========================================================== */

  if (mobileInput) {

    mobileInput.addEventListener(
      "input",
      () => {

        mobileInput.value =
          mobileInput.value
            .replace(/\D/g, "")
            .slice(0, 10);

      }
    );
  }


  /* ==========================================================
     MESSAGE HELPERS
  ========================================================== */

  function clearMessages() {

    if (globalError) {
      globalError.style.display = "none";
      globalError.textContent = "";
    }

    if (globalSuccess) {
      globalSuccess.style.display = "none";
      globalSuccess.textContent = "";
    }
  }


  function showError(message) {

    if (globalSuccess) {
      globalSuccess.style.display = "none";
    }

    if (globalError) {
      globalError.textContent = message;
      globalError.style.display = "block";
    }
  }


  function showSuccess(message) {

    if (globalError) {
      globalError.style.display = "none";
    }

    if (globalSuccess) {
      globalSuccess.textContent = message;
      globalSuccess.style.display = "block";
    }
  }


  /* ==========================================================
     VALIDATION
  ========================================================== */

  function clearValidation() {

    [
      fullNameInput,
      mobileInput,
      emailInput,
      passwordInput,
      confirmPasswordInput
    ].forEach((input) => {

      if (input) {
        input.classList.remove("error");
      }

    });


    [
      fullNameError,
      mobileError,
      emailError,
      passwordError,
      confirmPasswordError
    ].forEach((error) => {

      if (error) {
        error.style.display = "none";
      }

    });
  }


  function resetSignupButton() {

    if (!submitBtn) {
      return;
    }

    submitBtn.disabled = false;

    submitBtn.innerHTML =
      "<span>CREATE ACCOUNT</span><span>→</span>";
  }


  /* ==========================================================
     EMAIL SIGNUP
  ========================================================== */

  if (signupForm) {

    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessages();
        clearValidation();


        const name =
          fullNameInput.value.trim();

        const mobile =
          mobileInput.value.trim();

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;


        let isValid = true;


        /* NAME */

        if (name.length < 2) {

          fullNameInput.classList.add("error");

          fullNameError.style.display =
            "block";

          isValid = false;
        }


        /* MOBILE */

        if (!/^[6-9]\d{9}$/.test(mobile)) {

          mobileInput.classList.add("error");

          mobileError.style.display =
            "block";

          isValid = false;
        }


        /* EMAIL */

        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {

          emailInput.classList.add("error");

          emailError.style.display =
            "block";

          isValid = false;
        }


        /* PASSWORD */

        if (password.length < 6) {

          passwordInput.classList.add("error");

          passwordError.style.display =
            "block";

          isValid = false;
        }


        /* CONFIRM PASSWORD */

        if (
          confirmPassword.length < 6 ||
          confirmPassword !== password
        ) {

          confirmPasswordInput.classList.add(
            "error"
          );

          confirmPasswordError.style.display =
            "block";

          isValid = false;
        }


        if (!isValid) {
          return;
        }


        submitBtn.disabled = true;

        submitBtn.innerHTML =
          "<span>Creating account...</span>";


        try {

          /* ==================================================
             CHECK MOBILE
          ================================================== */

          const phoneExists =
            await checkPhoneExists(mobile);


          if (phoneExists) {

            showError(
              "This mobile number is already registered. Please use another number or sign in."
            );

            resetSignupButton();

            return;
          }


          /* ==================================================
             CREATE AUTH USER
          ================================================== */

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          /* ==================================================
             SAVE DISPLAY NAME IN FIREBASE AUTH
          ================================================== */

          await updateProfile(
            user,
            {
              displayName: name
            }
          );


          await user.reload();


          const updatedUser =
            auth.currentUser || user;


          /* ==================================================
             SAVE USER TO FIRESTORE
          ================================================== */

          const userDocRef =
            doc(
              db,
              "users",
              updatedUser.uid
            );


          await setDoc(
            userDocRef,
            {

              uid:
                updatedUser.uid,

              name:
                name,

              displayName:
                name,

              email:
                email,

              mobile:
                mobile,

              photoURL:
                updatedUser.photoURL || "",

              createdAt:
                new Date().toISOString(),

              subscription: {
                active: false,
                plan: "Free"
              },

              stats: {
                testsAttempted: 0,
                questionsSolved: 0,
                correctCount: 0,
                incorrectCount: 0,
                totalScore: 0,
                accuracy: 0,
                streak: 0,
                studyTimeMinutes: 0
              }

            },
            {
              merge: true
            }
          );


          /* ==================================================
             TOKEN
          ================================================== */

          let token = "";

          try {

            token =
              await updatedUser.getIdToken(true);

          } catch (tokenError) {

            console.warn(
              "Could not get ID token:",
              tokenError
            );
          }


          /* ==================================================
             LOCAL STORAGE
          ================================================== */

          const userData = {

            uid:
              updatedUser.uid,

            name:
              name,

            displayName:
              name,

            email:
              email,

            mobile:
              mobile,

            photoURL:
              updatedUser.photoURL || "",

            token:
              token,

            signupTime:
              new Date().toISOString()

          };


          localStorage.setItem(
            "rankhub_user",
            JSON.stringify(userData)
          );


          /* ==================================================
             SUCCESS
          ================================================== */

          showSuccess(
            `Welcome ${name}! Account created successfully.`
          );


          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 1000);


        } catch (error) {

          console.error(
            "RankHub Signup Error:",
            error
          );


          let message =
            "Unable to create your account. Please try again.";


          switch (error.code) {

            case "auth/email-already-in-use":

              message =
                "This email is already registered. Please sign in instead.";

              break;


            case "auth/invalid-email":

              message =
                "Please enter a valid email address.";

              break;


            case "auth/weak-password":

              message =
                "Password is too weak. Please use at least 6 characters.";

              break;


            case "auth/network-request-failed":

              message =
                "Network error. Please check your internet connection.";

              break;


            case "auth/operation-not-allowed":

              message =
                "Email/Password sign-up is not enabled in Firebase Authentication.";

              break;


            case "permission-denied":

            case "firestore/permission-denied":

              message =
                "Account created, but Firestore permission was denied. Please check Firestore rules.";

              break;


            default:

              if (
                error.message &&
                error.message
                  .toLowerCase()
                  .includes("permission")
              ) {

                message =
                  "Firestore permission denied. Please check Firestore rules.";

              } else if (
                error.message &&
                error.message
                  .toLowerCase()
                  .includes("network")
              ) {

                message =
                  "Network error. Please check your internet connection.";
              }
          }


          showError(message);

          resetSignupButton();
        }
      }
    );
  }


  /* ==========================================================
     GOOGLE SIGNUP
  ========================================================== */

  if (googleSignInBtn) {

    googleSignInBtn.addEventListener(
      "click",
      async () => {

        clearMessages();
        clearValidation();


        googleSignInBtn.disabled = true;

        googleSignInBtn.innerHTML =
          "<span>Connecting to Google...</span>";


        try {

          const provider =
            new GoogleAuthProvider();


          provider.setCustomParameters({
            prompt: "select_account"
          });


          const result =
            await signInWithPopup(
              auth,
              provider
            );


          const user =
            result.user;


          /* ==================================================
             GOOGLE NAME
          ================================================== */

          const googleName =
            user.displayName?.trim() ||
            user.email
              ?.split("@")[0]
              ?.trim() ||
            "User";


          /*
           * Google account ka existing displayName
           * use kiya ja raha hai.
           *
           * updateProfile ki zarurat nahi hai.
           */

          const finalUser =
            auth.currentUser || user;


          /* ==================================================
             FIRESTORE
          ================================================== */

          const userDocRef =
            doc(
              db,
              "users",
              finalUser.uid
            );


          await setDoc(
            userDocRef,
            {

              uid:
                finalUser.uid,

              name:
                googleName,

              displayName:
                googleName,

              email:
                finalUser.email || "",

              mobile:
                "",

              photoURL:
                finalUser.photoURL || "",

              createdAt:
                new Date().toISOString(),

              subscription: {
                active: false,
                plan: "Free"
              },

              stats: {
                testsAttempted: 0,
                questionsSolved: 0,
                correctCount: 0,
                incorrectCount: 0,
                totalScore: 0,
                accuracy: 0,
                streak: 0,
                studyTimeMinutes: 0
              }

            },
            {
              merge: true
            }
          );


          /* ==================================================
             TOKEN
          ================================================== */

          let token = "";

          try {

            token =
              await finalUser.getIdToken(true);

          } catch (tokenError) {

            console.warn(
              "Could not get ID token:",
              tokenError
            );
          }


          /* ==================================================
             LOCAL STORAGE
          ================================================== */

          const userData = {

            uid:
              finalUser.uid,

            name:
              googleName,

            displayName:
              googleName,

            email:
              finalUser.email || "",

            mobile:
              "",

            photoURL:
              finalUser.photoURL || "",

            token:
              token,

            signupTime:
              new Date().toISOString()

          };


          localStorage.setItem(
            "rankhub_user",
            JSON.stringify(userData)
          );


          showSuccess(
            `Welcome ${googleName}! Redirecting...`
          );


          setTimeout(() => {

            window.location.href =
              "./index.html";

          }, 800);


        } catch (error) {

          console.error(
            "RankHub Google Signup Error:",
            error
          );


          let message =
            "Google sign-in failed. Please try again.";


          switch (error.code) {

            case "auth/popup-closed-by-user":

              message =
                "Google sign-in was cancelled.";

              break;


            case "auth/popup-blocked":

              message =
                "Your browser blocked the Google popup. Please allow popups and try again.";

              break;


            case "auth/account-exists-with-different-credential":

              message =
                "An account already exists with this email using another sign-in method.";

              break;


            case "auth/network-request-failed":

              message =
                "Network error. Please check your internet connection.";

              break;


            case "auth/unauthorized-domain":

              message =
                "This website domain is not authorized in Firebase Authentication.";

              break;


            case "permission-denied":

            case "firestore/permission-denied":

              message =
                "Google login succeeded, but Firestore permission was denied.";

              break;
          }


          showError(message);


        } finally {

          googleSignInBtn.disabled = false;

          googleSignInBtn.innerHTML =
            "<span>🔵</span><span>Continue with Google</span>";

        }
      }
    );
  }

});
</script>

</body>
</html>
