<script type="module">
  import {
    auth,
    db,
    createUserWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithPopup,
    updateProfile,
    doc,
    setDoc,
    checkPhoneExists
  } from "./firebase.js";

  document.addEventListener("DOMContentLoaded", () => {

    const signupForm =
      document.getElementById("signupForm");

    const fullNameInput =
      document.getElementById("fullNameInput");

    const mobileInput =
      document.getElementById("mobileInput");

    const emailInput =
      document.getElementById("emailInput");

    const passwordInput =
      document.getElementById("passwordInput");

    const confirmPasswordInput =
      document.getElementById("confirmPasswordInput");

    const fullNameError =
      document.getElementById("fullNameError");

    const mobileError =
      document.getElementById("mobileError");

    const emailError =
      document.getElementById("emailError");

    const passwordError =
      document.getElementById("passwordError");

    const confirmPasswordError =
      document.getElementById("confirmPasswordError");

    const submitBtn =
      document.getElementById("submitBtn");

    const googleSignInBtn =
      document.getElementById("googleSignInBtn");

    const globalError =
      document.getElementById("globalError");

    const globalSuccess =
      document.getElementById("globalSuccess");

    function setupPasswordToggle(inputId, buttonId) {
      const input =
        document.getElementById(inputId);

      const button =
        document.getElementById(buttonId);

      if (!input || !button) return;

      button.addEventListener("click", () => {
        const show =
          input.type === "password";

        input.type =
          show ? "text" : "password";

        button.setAttribute(
          "aria-label",
          show ? "Hide Password" : "Show Password"
        );
      });
    }

    setupPasswordToggle(
      "passwordInput",
      "passwordToggle"
    );

    setupPasswordToggle(
      "confirmPasswordInput",
      "confirmPasswordToggle"
    );

    mobileInput.addEventListener("input", () => {
      mobileInput.value =
        mobileInput.value
          .replace(/\D/g, "")
          .slice(0, 10);
    });

    function clearMessages() {
      globalError.style.display = "none";
      globalSuccess.style.display = "none";

      globalError.textContent = "";
      globalSuccess.textContent = "";
    }

    function showError(message) {
      globalSuccess.style.display = "none";

      globalError.textContent = message;
      globalError.style.display = "block";
    }

    function showSuccess(message) {
      globalError.style.display = "none";

      globalSuccess.textContent = message;
      globalSuccess.style.display = "block";
    }

    function clearValidation() {
      [
        fullNameInput,
        mobileInput,
        emailInput,
        passwordInput,
        confirmPasswordInput
      ].forEach(input => {
        input.classList.remove("error");
      });

      [
        fullNameError,
        mobileError,
        emailError,
        passwordError,
        confirmPasswordError
      ].forEach(error => {
        error.style.display = "none";
      });
    }

    function resetSignupButton() {
      submitBtn.disabled = false;

      submitBtn.innerHTML =
        "<span>CREATE ACCOUNT</span><span>→</span>";
    }

    signupForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessages();
        clearValidation();

        const name =
          fullNameInput.value.trim();

        const mobile =
          mobileInput.value.trim();

        const email =
          emailInput.value
            .trim()
            .toLowerCase();

        const password =
          passwordInput.value;

        const confirmPassword =
          confirmPasswordInput.value;

        let isValid = true;

        if (name.length < 2) {
          fullNameInput.classList.add("error");
          fullNameError.style.display = "block";
          isValid = false;
        }

        if (!/^[6-9]\d{9}$/.test(mobile)) {
          mobileInput.classList.add("error");
          mobileError.style.display = "block";
          isValid = false;
        }

        const emailPattern =
          /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!emailPattern.test(email)) {
          emailInput.classList.add("error");
          emailError.style.display = "block";
          isValid = false;
        }

        if (password.length < 6) {
          passwordInput.classList.add("error");
          passwordError.style.display = "block";
          isValid = false;
        }

        if (
          confirmPassword.length < 6 ||
          confirmPassword !== password
        ) {
          confirmPasswordInput.classList.add("error");
          confirmPasswordError.style.display = "block";
          isValid = false;
        }

        if (!isValid) return;

        submitBtn.disabled = true;

        submitBtn.innerHTML =
          "<span>Creating account...</span>";

        try {

          const phoneExists =
            await checkPhoneExists(mobile);

          if (phoneExists) {
            showError(
              "This mobile number is already registered. Please use another number or sign in."
            );

            resetSignupButton();
            return;
          }

          const userCredential =
            await createUserWithEmailAndPassword(
              auth,
              email,
              password
            );

          const user =
            userCredential.user;

          await updateProfile(user, {
            displayName: name
          });

          await user.reload();

          const updatedUser =
            auth.currentUser;

          const userDocRef =
            doc(
              db,
              "users",
              updatedUser.uid
            );

          await setDoc(
            userDocRef,
            {
              uid: updatedUser.uid,

              name: name,

              displayName: name,

              email: email,

              mobile: mobile,

              photoURL: "",

              createdAt:
                new Date().toISOString(),

              subscription: {
                active: false,
                plan: "Free"
              },

              stats: {
                testsAttempted: 0,
                questionsSolved: 0,
                correctCount: 0,
                incorrectCount: 0,
                totalScore: 0,
                accuracy: 0,
                streak: 0,
                studyTimeMinutes: 0
              }
            },
            {
              merge: true
            }
          );

          let token = "";

          try {
            token =
              await updatedUser.getIdToken(true);
          } catch (tokenError) {
            console.warn(
              "Could not get ID token:",
              tokenError
            );
          }

          const userData = {
            uid:
              updatedUser.uid,

            name:
              name,

            displayName:
              name,

            email:
              email,

            mobile:
              mobile,

            photoURL:
              "",

            token:
              token,

            signupTime:
              new Date().toISOString()
          };

          localStorage.setItem(
            "rankhub_user",
            JSON.stringify(userData)
          );

          showSuccess(
            `Welcome ${name}! Account created successfully.`
          );

          setTimeout(() => {
            window.location.href =
              "./index.html";
          }, 1000);

        } catch (error) {

          console.error(
            "RankHub Signup Error:",
            error
          );

          let message =
            "Unable to create your account. Please try again.";

          switch (error.code) {

            case "auth/email-already-in-use":
              message =
                "This email is already registered. Please sign in instead.";
              break;

            case "auth/invalid-email":
              message =
                "Please enter a valid email address.";
              break;

            case "auth/weak-password":
              message =
                "Password is too weak. Please use at least 6 characters.";
              break;

            case "auth/network-request-failed":
              message =
                "Network error. Please check your internet connection.";
              break;

            case "auth/operation-not-allowed":
              message =
                "Email/Password sign-up is not enabled in Firebase Authentication.";
              break;

            case "permission-denied":
            case "firestore/permission-denied":
              message =
                "Account created, but Firestore permission was denied. Please check Firestore rules.";
              break;

            default:

              if (
                error.message &&
                error.message
                  .toLowerCase()
                  .includes("permission")
              ) {
                message =
                  "Firestore permission denied. Please check Firestore rules.";

              } else if (
                error.message &&
                error.message
                  .toLowerCase()
                  .includes("network")
              ) {
                message =
                  "Network error. Please check your internet connection.";
              }
          }

          showError(message);

          resetSignupButton();
        }
      }
    );

    googleSignInBtn.addEventListener(
      "click",
      async () => {

        clearMessages();
        clearValidation();

        googleSignInBtn.disabled = true;

        googleSignInBtn.innerHTML =
          "<span>Connecting to Google...</span>";

        try {

          const provider =
            new GoogleAuthProvider();

          provider.setCustomParameters({
            prompt: "select_account"
          });

          const result =
            await signInWithPopup(
              auth,
              provider
            );

          const user =
            result.user;

          const googleName =
            user.displayName?.trim() ||
            user.email
              ?.split("@")[0]
              ?.trim() ||
            "User";

          if (
            !user.displayName ||
            user.displayName.trim() !== googleName
          ) {
            await updateProfile(user, {
              displayName: googleName
            });
          }

          await user.reload();

          const finalUser =
            auth.currentUser;

          const userDocRef =
            doc(
              db,
              "users",
              finalUser.uid
            );

          await setDoc(
            userDocRef,
            {
              uid:
                finalUser.uid,

              name:
                googleName,

              displayName:
                googleName,

              email:
                finalUser.email || "",

              mobile:
                "",

              photoURL:
                finalUser.photoURL || "",

              createdAt:
                new Date().toISOString(),

              subscription: {
                active: false,
                plan: "Free"
              },

              stats: {
                testsAttempted: 0,
                questionsSolved: 0,
                correctCount: 0,
                incorrectCount: 0,
                totalScore: 0,
                accuracy: 0,
                streak: 0,
                studyTimeMinutes: 0
              }
            },
            {
              merge: true
            }
          );

          let token = "";

          try {
            token =
              await finalUser.getIdToken(true);
          } catch (tokenError) {
            console.warn(
              "Could not get ID token:",
              tokenError
            );
          }

          const userData = {
            uid:
              finalUser.uid,

            name:
              googleName,

            displayName:
              googleName,

            email:
              finalUser.email || "",

            mobile:
              "",

            photoURL:
              finalUser.photoURL || "",

            token:
              token,

            signupTime:
              new Date().toISOString()
          };

          localStorage.setItem(
            "rankhub_user",
            JSON.stringify(userData)
          );

          showSuccess(
            `Welcome ${googleName}! Redirecting...`
          );

          setTimeout(() => {
            window.location.href =
              "./index.html";
          }, 800);

        } catch (error) {

          console.error(
            "RankHub Google Signup Error:",
            error
          );

          let message =
            "Google sign-in failed. Please try again.";

          switch (error.code) {

            case "auth/popup-closed-by-user":
              message =
                "Google sign-in was cancelled.";
              break;

            case "auth/popup-blocked":
              message =
                "Your browser blocked the Google popup. Please allow popups and try again.";
              break;

            case "auth/account-exists-with-different-credential":
              message =
                "An account already exists with this email using another sign-in method.";
              break;

            case "auth/network-request-failed":
              message =
                "Network error. Please check your internet connection.";
              break;

            case "auth/unauthorized-domain":
              message =
                "This website domain is not authorized in Firebase Authentication.";
              break;

            case "permission-denied":
            case "firestore/permission-denied":
              message =
                "Google login succeeded, but Firestore permission was denied.";
              break;
          }

          showError(message);

        } finally {

          googleSignInBtn.disabled = false;

          googleSignInBtn.innerHTML =
            "<span>🔵</span><span>Continue with Google</span>";
        }
      }
    );

  });
</script>
