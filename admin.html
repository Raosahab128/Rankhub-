<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Admin Dashboard | RankHub</title>
    <link rel="stylesheet" href="/style.css">
  
  <style id="auth-guard-style">body { display: none !important; }</style>
  <script type="module" src="./auth-guard.js"></script>
</head>
  <body>
    <!-- Global Header -->
    <header class="global-header">
      <div class="header-left">
        <button class="premium-menu-btn" id="menuToggleBtn" aria-label="Open Navigation Menu" aria-expanded="false" aria-controls="appSidebar">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <a href="./index.html" class="header-logo" aria-label="RankHub Home">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="brand-logo-icon"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          <span class="brand-logo-text"><span class="logo-accent">RANK</span>HUB <span style="font-size: 0.75rem; background: #DC2626; color: #fff; padding: 2px 6px; border-radius: 4px; margin-left: 6px;">ADMIN</span></span>
        </a>
      </div>

      <div class="header-right">
        <a href="./profile.html" class="header-profile-avatar" aria-label="User Profile">
          <img src="https://ui-avatars.com/api/?name=Admin&background=DC2626&color=fff" alt="Admin Avatar" />
        </a>
      </div>
    </header>

    <!-- Main Container -->
    <main class="page-content container" style="max-width: 1200px;" id="adminAppContainer">
      <div style="text-align: center; padding: 60px; color: #64748B;">Verifying Admin Authorization...</div>
    </main>

    <!-- Footer -->
    

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <!-- Professional Sidebar Drawer -->
    <aside class="app-sidebar" id="appSidebar" aria-label="Main Navigation">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <a href="./index.html" class="sidebar-logo-link" aria-label="RankHub Home">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-logo-icon">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
            <div class="sidebar-logo-text-group">
              <span class="sidebar-logo-text"><span class="logo-accent">RANK</span>HUB</span>
              <span class="sidebar-subtitle">Admin Control Center</span>
            </div>
          </a>
        </div>
        <button class="sidebar-close-btn" id="sidebarCloseBtn" aria-label="Close Navigation Menu">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="sidebar-body">
        <nav class="sidebar-nav">
          <div class="nav-group">
            <div class="nav-group-title">ADMIN MENU</div>
            <ul class="nav-group-list">
              <li>
                <a href="./admin.html" class="sidebar-nav-item" style="background: #FEF2F2; color: #DC2626; font-weight: 700;">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                  <span>Subscription Dashboard</span>
                </a>
              </li>
              <li>
                <a href="./index.html" class="sidebar-nav-item">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="nav-icon"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                  <span>Back to App Home</span>
                </a>
              </li>
            </ul>
          </div>
        </nav>
      </div>
    </aside>
  <script type="module" src="./navigation.js"></script>
  <script type="module" src="./admin.js"></script>
</body>
</html>
